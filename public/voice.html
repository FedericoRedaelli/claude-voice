<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>claude-voice</title>
    <style>
      :root { color-scheme: dark light; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 15px/1.5 -apple-system, system-ui, sans-serif;
        background: #14151a; color: #e7e7ea;
      }
      main { width: min(30rem, 90vw); text-align: center; }
      h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; margin: 0 0 .25rem; }
      p.sub { margin: 0 0 2rem; opacity: .55; font-size: .85rem; }
      button {
        font: inherit; font-weight: 600; padding: .9rem 2rem; border: 0; border-radius: 999px;
        background: #d97757; color: #14151a; cursor: pointer;
      }
      button:hover { filter: brightness(1.08); }
      #status { margin-top: 1.5rem; font-size: .85rem; opacity: .75; min-height: 1.5em; }
      #meter { margin: 1.25rem auto 0; width: 100%; height: 6px; border-radius: 3px; background: #26272e; overflow: hidden; }
      #bar { height: 100%; width: 0; background: #6cc38a; transition: width .06s linear; }
      .dot { display: inline-block; width: .5rem; height: .5rem; border-radius: 50%; background: #6cc38a; margin-right: .4rem; vertical-align: baseline; }
      .off { background: #7a7b85; }
      .hint { margin-top: 2rem; font-size: .78rem; opacity: .4; }
    </style>
  </head>
  <body>
    <main>
      <h1>claude-voice</h1>
      <p class="sub">scheda audio del loop vocale</p>
      <button id="go">Attiva audio</button>
      <div id="meter" hidden><div id="bar"></div></div>
      <div id="status">In attesa di attivazione.</div>
      <p class="hint">Lascia questa scheda aperta. Il microfono si accende solo quando Claude sta ascoltando.</p>
    </main>

    <script>
      // The page is a sound card, nothing more: PCM16 mono @ 24 kHz over the websocket in
      // both directions. The reason it exists at all is one line further down —
      // echoCancellation: true — which Node has no equivalent for.
      const RATE = 24000;
      const goBtn = document.getElementById("go");
      const statusEl = document.getElementById("status");
      const meter = document.getElementById("meter");
      const bar = document.getElementById("bar");

      const say = (html) => { statusEl.innerHTML = html; };

      // Both worklets are inlined as blob modules so the whole page stays one file the Node
      // side can serve from memory.
      const WORKLET = `
        class Cap extends AudioWorkletProcessor {
          constructor() {
            super();
            this.buf = new Int16Array(480); // 20 ms at 24 kHz
            this.n = 0;
            this.on = false;
            this.port.onmessage = (e) => { this.on = !!e.data.on; if (!this.on) this.n = 0; };
          }
          process(inputs) {
            const ch = inputs[0] && inputs[0][0];
            if (!ch || !this.on) return true;
            let peak = 0;
            for (let i = 0; i < ch.length; i++) {
              let s = ch[i];
              if (s > 1) s = 1; else if (s < -1) s = -1;
              const a = s < 0 ? -s : s;
              if (a > peak) peak = a;
              this.buf[this.n++] = s < 0 ? s * 32768 : s * 32767;
              if (this.n === this.buf.length) {
                this.port.postMessage({ pcm: this.buf.slice(), peak });
                this.n = 0;
                peak = 0;
              }
            }
            return true;
          }
        }
        class Play extends AudioWorkletProcessor {
          constructor() {
            super();
            this.q = [];
            this.off = 0;
            this.drainReq = false;
            this.port.onmessage = (e) => {
              const d = e.data;
              if (d.cmd === "clear") {
                this.q = []; this.off = 0; this.drainReq = false;
                this.port.postMessage({ t: "drained" });
              } else if (d.cmd === "drain") {
                // Answer straight away when there is nothing left, otherwise process() will.
                if (!this.q.length) this.port.postMessage({ t: "drained" });
                else this.drainReq = true;
              } else if (d.pcm) {
                this.q.push(d.pcm);
              }
            };
          }
          process(inputs, outputs) {
            const out = outputs[0][0];
            let i = 0;
            while (i < out.length && this.q.length) {
              const cur = this.q[0];
              const n = Math.min(out.length - i, cur.length - this.off);
              out.set(cur.subarray(this.off, this.off + n), i);
              i += n; this.off += n;
              if (this.off >= cur.length) { this.q.shift(); this.off = 0; }
            }
            while (i < out.length) out[i++] = 0;
            if (this.drainReq && !this.q.length) {
              this.drainReq = false;
              this.port.postMessage({ t: "drained" });
            }
            return true;
          }
        }
        registerProcessor("cap", Cap);
        registerProcessor("play", Play);
      `;

      let ws = null;
      let capNode = null;
      let playNode = null;
      let micOn = false;

      function connect() {
        const t = new URLSearchParams(location.search).get("t");
        ws = new WebSocket(`ws://${location.host}/ws?t=${encodeURIComponent(t)}`);
        ws.binaryType = "arraybuffer";

        ws.onopen = () => {
          say('<span class="dot off"></span>Collegato. In attesa che Claude parli.');
          ws.send(JSON.stringify({ t: "ready", sampleRate: RATE }));
        };
        ws.onmessage = (ev) => {
          if (typeof ev.data !== "string") {
            // Playback: PCM16LE straight into the worklet's queue.
            const pcm = new Int16Array(ev.data);
            const f = new Float32Array(pcm.length);
            for (let i = 0; i < pcm.length; i++) f[i] = pcm[i] / 32768;
            playNode?.port.postMessage({ pcm: f }, [f.buffer]);
            return;
          }
          const msg = JSON.parse(ev.data);
          if (msg.t === "clear") playNode?.port.postMessage({ cmd: "clear" });
          else if (msg.t === "drain") playNode?.port.postMessage({ cmd: "drain" });
          else if (msg.t === "mic") setMic(!!msg.on);
        };
        ws.onclose = () => {
          setMic(false);
          say('<span class="dot off"></span>Scollegato. Riprovo…');
          setTimeout(connect, 2000);
        };
        ws.onerror = () => {};
      }

      function setMic(on) {
        micOn = on;
        capNode?.port.postMessage({ on });
        if (!on) bar.style.width = "0%";
        say(
          on
            ? '<span class="dot"></span><b>Ti ascolto.</b> Parla pure.'
            : '<span class="dot off"></span>Collegato. Microfono spento.',
        );
      }

      goBtn.addEventListener("click", async () => {
        goBtn.disabled = true;
        try {
          // A fixed 24 kHz context means no resampling anywhere: the graph delivers exactly
          // the format the Realtime API and the sox-era code both expect.
          const ctx = new AudioContext({ sampleRate: RATE, latencyHint: "interactive" });
          await ctx.resume();

          const stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              // THE reason this page exists. Chrome's WebRTC echo canceller removes what the
              // browser is playing from what the microphone hears, so the agent can be
              // interrupted mid-sentence on open speakers without hearing itself.
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
              channelCount: 1,
            },
          });

          const url = URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" }));
          await ctx.audioWorklet.addModule(url);
          URL.revokeObjectURL(url);

          capNode = new AudioWorkletNode(ctx, "cap");
          playNode = new AudioWorkletNode(ctx, "play", { outputChannelCount: [1] });

          capNode.port.onmessage = (e) => {
            const { pcm, peak } = e.data;
            if (ws?.readyState === 1) ws.send(pcm.buffer);
            bar.style.width = `${Math.min(100, peak * 140)}%`;
          };
          playNode.port.onmessage = (e) => {
            if (e.data?.t === "drained" && ws?.readyState === 1)
              ws.send(JSON.stringify({ t: "drained" }));
          };

          // A capture node is only pulled by the graph when it reaches the destination, so
          // it goes there through a silent gain — muted, or the mic would be looped back
          // into the speakers.
          const mute = new GainNode(ctx, { gain: 0 });
          ctx.createMediaStreamSource(stream).connect(capNode).connect(mute).connect(ctx.destination);
          playNode.connect(ctx.destination);

          goBtn.hidden = true;
          meter.hidden = false;
          connect();
        } catch (err) {
          goBtn.disabled = false;
          say(`Errore: ${err?.message ?? err}`);
          if (ws?.readyState === 1) ws.send(JSON.stringify({ t: "error", message: String(err?.message ?? err) }));
        }
      });
    </script>
  </body>
</html>
